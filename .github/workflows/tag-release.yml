name: Tag Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. Use vX.Y.Z, X.Y.Z, or leave empty to bump the latest patch tag.'
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: tag-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-tag:
    name: Create Release Tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          requested="$REQUESTED_VERSION"
          latest="$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [[ -z "$requested" ]]; then
            if [[ -z "$latest" ]]; then
              requested="v0.1.0"
            else
              IFS=. read -r major minor patch <<< "${latest#v}"
              requested="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          if [[ "$requested" != v* ]]; then
            requested="v${requested}"
          fi

          if [[ ! "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use vX.Y.Z or X.Y.Z format; got $requested"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$requested" >/dev/null; then
            echo "Tag $requested already exists"
            exit 1
          fi

          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "main HEAD is already release-tagged:"
            git tag --points-at HEAD
            exit 1
          fi

          echo "tag=$requested" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $requested"

      - name: Verify main tests passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_sha="$(git rev-parse HEAD)"
          # No --event filter: accept push-triggered runs and workflow_dispatch
          # reruns used to recover from dropped push events.
          conclusion="$(gh run list \
            --workflow Test \
            --branch main \
            --commit "$target_sha" \
            --status completed \
            --json conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].conclusion // .[0].conclusion // ""' \
            --limit 10)"
          url="$(gh run list \
            --workflow Test \
            --branch main \
            --commit "$target_sha" \
            --status completed \
            --json url,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].url // .[0].url // ""' \
            --limit 10)"

          if [[ "$conclusion" != "success" ]]; then
            echo "No successful Test workflow found for main commit $target_sha."
            if [[ -n "$url" ]]; then
              echo "Latest completed Test run: $url"
            fi
            exit 1
          fi

          echo "Verified Test workflow success for $target_sha: $url"

      - name: Resolve release range
        id: range
        run: |
          latest_tag="${{ steps.version.outputs.latest_tag }}"
          if [[ -z "$latest_tag" ]]; then
            base_ref="$(git rev-list --max-parents=0 HEAD)"
          else
            base_ref="$latest_tag"
          fi

          git diff --name-only "$base_ref"..HEAD > "$RUNNER_TEMP/changed-files.txt"

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "changed_files=$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"

      - name: Collect pull request metadata
        env:
          BASE_REF: ${{ steps.range.outputs.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PRS_FILE: ${{ runner.temp }}/release-prs.json
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const repo = process.env.GITHUB_REPOSITORY;
          const baseRef = process.env.BASE_REF;
          const prsFile = process.env.PRS_FILE;
          const shas = execFileSync('git', ['rev-list', '--reverse', `${baseRef}..HEAD`], {
            encoding: 'utf8',
          })
            .split(/\s+/)
            .filter(Boolean);
          const prs = new Map();

          for (const sha of shas) {
            const raw = execFileSync(
              'gh',
              ['api', '-H', 'Accept: application/vnd.github+json', `/repos/${repo}/commits/${sha}/pulls`],
              { encoding: 'utf8' },
            );
            for (const pr of JSON.parse(raw)) {
              if (prs.has(pr.number)) {
                continue;
              }

              let files = [];
              try {
                files = execFileSync(
                  'gh',
                  ['pr', 'view', String(pr.number), '--repo', repo, '--json', 'files', '--jq', '.files[].path'],
                  { encoding: 'utf8' },
                )
                  .split(/\r?\n/)
                  .filter(Boolean);
              } catch {
                files = [];
              }

              prs.set(pr.number, {
                number: pr.number,
                title: pr.title,
                body: pr.body ?? '',
                labels: (pr.labels ?? []).map((label) => label.name),
                url: pr.html_url,
                files,
              });
            }
          }

          fs.writeFileSync(prsFile, `${JSON.stringify([...prs.values()], null, 2)}\n`);
          NODE

          echo "Collected pull requests:"
          cat "$PRS_FILE"

      - name: Generate release notes
        run: |
          node scripts/release_notes.mjs \
            --changed-files "${{ steps.range.outputs.changed_files }}" \
            --prs "$RUNNER_TEMP/release-prs.json" \
            --plan-out "$RUNNER_TEMP/release-plan.json"

          node -e "const fs = require('fs'); const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/release-plan.json', 'utf8')); if (!plan.shouldRelease) { console.error('Manual Tag Release refused: ' + plan.skipReason); process.exit(1); }"

          node scripts/release_notes.mjs \
            --changed-files "${{ steps.range.outputs.changed_files }}" \
            --prs "$RUNNER_TEMP/release-prs.json" \
            --version "${{ steps.version.outputs.tag }}" \
            --notes-out "$RUNNER_TEMP/release-notes.md"

          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes_b64="$(base64 -w0 "$RUNNER_TEMP/release-notes.md")"
          gh workflow run release.yml --ref "${{ steps.version.outputs.tag }}" -f release_notes_b64="$release_notes_b64"
