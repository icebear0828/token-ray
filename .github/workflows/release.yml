name: Release

on:
  workflow_dispatch:
    inputs:
      release_notes_b64:
        description: 'Base64-encoded release notes markdown generated by Auto Release.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z format; got $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Align Wails product version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/set_wails_version.mjs --write
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Build Frontend
        run: cd frontend && npm install --silent && npm run build
      - name: Install Playwright Browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run frontend E2E
        run: cd frontend && npm run test:e2e
      - name: Run Go Tests
        run: go test -race -count=1 -timeout=5m ./...
      - name: Build verification
        run: go build ./...

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align Wails product version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/set_wails_version.mjs --write
      - name: Build Frontend
        run: cd frontend && npm install --silent && npm run build
      - name: Run Tests
        run: go test -race -count=1 -timeout=5m ./...
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build macOS M-Series (Apple Silicon)
        run: |
          cd cmd/dashboard
          wails build -platform darwin/arm64 -clean
          mkdir -p ../../build/bin
          mv "build/bin/AI Flight Dashboard.app" "../../build/bin/AI Flight Dashboard.app"
          cd ../../build/bin
          tar -czvf ai-flight-dashboard-macos-m-series.tar.gz "AI Flight Dashboard.app"
          rm -rf "AI Flight Dashboard.app"
      - name: Build macOS Intel
        run: |
          cd cmd/dashboard
          wails build -platform darwin/amd64 -clean
          mkdir -p ../../build/bin
          mv "build/bin/AI Flight Dashboard.app" "../../build/bin/AI Flight Dashboard.app"
          cd ../../build/bin
          tar -czvf ai-flight-dashboard-macos-intel.tar.gz "AI Flight Dashboard.app"
          rm -rf "AI Flight Dashboard.app"
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align Wails product version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/set_wails_version.mjs --write
      - name: Build Frontend
        run: cd frontend && npm install --silent && npm run build
      - name: Run Tests
        run: go test -count=1 -timeout=5m ./...
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build Windows App
        run: |
          cd cmd/dashboard
          wails build -platform windows/amd64 -clean
          mkdir -p ../../build/bin
          mv "build/bin/ai-flight-dashboard.exe" "../../build/bin/"
      - name: Archive App
        run: |
          cd build/bin
          Compress-Archive -Path "ai-flight-dashboard.exe" -DestinationPath ai-flight-dashboard-windows.zip
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/ai-flight-dashboard-windows.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align Wails product version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/set_wails_version.mjs --write
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Build Frontend
        run: cd frontend && npm install --silent && npm run build
      - name: Run Tests
        run: go test -race -count=1 -timeout=5m ./...
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build Linux App
        run: |
          cd cmd/dashboard
          wails build -platform linux/amd64 -clean
          mkdir -p ../../build/bin
          mv "build/bin/ai-flight-dashboard" "../../build/bin/"
      - name: Archive App
        run: |
          cd build/bin
          tar -czvf ai-flight-dashboard-linux.tar.gz ai-flight-dashboard
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/ai-flight-dashboard-linux.tar.gz

  update-release-notes:
    name: Update Release Notes
    runs-on: ubuntu-22.04
    needs: [build-macos, build-windows, build-linux]
    if: github.event_name == 'workflow_dispatch' && inputs.release_notes_b64 != ''
    steps:
      - name: Decode release notes
        env:
          RELEASE_NOTES_B64: ${{ inputs.release_notes_b64 }}
        run: printf '%s' "$RELEASE_NOTES_B64" | base64 --decode > release-notes.md

      - name: Update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
