<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <script>
      try {
        if (localStorage.getItem("ai-flight-dashboard_theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#090D16");
        }
      } catch {}
    </script>
    <title>AI Flight Dashboard — Local AI CLI Telemetry & Cost Attribution</title>
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-slate-900 selection:text-white dark:bg-[#090D16] dark:text-[#F1F5F9] dark:selection:bg-sky-400 dark:selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
